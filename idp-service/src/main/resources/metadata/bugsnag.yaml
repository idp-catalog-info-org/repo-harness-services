identifier: bugsnag
name: Bugsnag
description: View and monitor Bugsnag errors.
accountIdentifier: __GLOBAL_ACCOUNT_ID__
type: DEFAULT
creator: roadie.io
category: Monitoring
source: https://roadie.io/backstage/plugins/bugsnag/?utm_source=backstage.io&utm_medium=marketplace&utm_campaign=bugsnag

iconUrl: https://roadie.io/images/logos/bugsnag.png
imageUrl: ''
documentation: https://developer.harness.io/docs/internal-developer-portal/plugins/available-plugins/bug-snag
config: |-
  proxy:
    endpoints:
      /bugsnag/api:
        target: https://api.bugsnag.com
        pathRewrite:
          api/proxy/bugsnag/api?: /
        headers:
          Authorization: 'token ${BUGSNAG_PERSONAL_TOKEN}'
          X-version: "2"
environmentVariables:
  - BUGSNAG_PERSONAL_TOKEN
exports:
  defaultEntityTypes:
    - service
  exportDetails:
    - type: CARD
      name: EntityBugsnagErrorsOverviewTable
      addByDefault: true
      layoutSchemaSpecs:
        component: EntityBugsnagErrorsOverviewTable
        specs:
          gridProps:
            md: 6
