identifier: jira
name: Jira
description: View Jira summary for your projects in Backstage.
accountIdentifier: __GLOBAL_ACCOUNT_ID__
isDeleted: false
type: DEFAULT
creator: roadie.io
category: Agile Planning
source: https://roadie.io/backstage/plugins/jira/?utm_source=backstage.io&utm_medium=marketplace&utm_campaign=jira
iconUrl: https://roadie.io/images/logos/jira.png
imageUrl: ''
documentation: https://developer.harness.io/docs/internal-developer-portal/plugins/available-plugins/jira/
config: |-
  proxy:
    endpoints:
      '/jira/api':
        target: '<your-jira-url>'
        pathRewrite:
          'api/proxy/jira/api/?': '/'
        headers:
          Authorization: Basic ${JIRA_TOKEN}
          Accept: 'application/json'
          Content-Type: 'application/json'
          X-Atlassian-Token: 'nocheck'
          User-Agent: "MY-UA-STRING"
  jira:
    # Defaults to /jira/api and can be omitted if proxy is configured for that url
    proxyPath: /jira/api
    # Add it in case your JIRA instance is connected to Confluence, in order to filter those activities
    confluenceActivityFilter: wiki@uuid
    # Please specify the Jira API version you would like to use else the latest would be used
    # apiVersion: 
    # Defaults to `cloud`, but also supports `datacenter`
    product: cloud
environmentVariables:
  - JIRA_TOKEN
exports:
  defaultEntityTypes:
    - service
  exportDetails:
    - type: CARD
      name: EntityJiraOverviewCard
      addByDefault: true
      layoutSchemaSpecs:
        component: EntitySwitch
        specs:
          cases:
            - if: isJiraAvailable
              content:
                component: EntityJiraOverviewCard