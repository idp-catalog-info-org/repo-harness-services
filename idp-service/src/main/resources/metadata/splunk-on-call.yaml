identifier: splunk-on-call
name: Splunk-OnCall
description: Splunk On-Call offers a simple way to identify incidents and escalation policies.
accountIdentifier: __GLOBAL_ACCOUNT_ID__
type: DEFAULT
creator: ayshiff
category: Monitoring
source: https://github.com/backstage/backstage/tree/master/plugins/splunk-on-call
iconUrl: ''
imageUrl: ''
documentation: https://developer.harness.io/docs/internal-developer-portal/plugins/available-plugins/splunk-on-call
config: |-
  proxy:
    endpoints:
      '/splunk-on-call':
        target: https://api.victorops.com/api-public
        pathRewrite:
          api/proxy/splunk-on-call/?: /
        headers:
          X-VO-Api-Id: ${SPLUNK_ON_CALL_API_ID}
          X-VO-Api-Key: ${SPLUNK_ON_CALL_API_KEY}
        # prohibit the `/splunk-on-call` proxy endpoint from servicing non-GET requests
        allowedMethods: ['GET']
  splunkOnCall:
    eventsRestEndpoint: ${SPLUNK_ON_CALL_REST_ENDPOINT}
environmentVariables:
  - SPLUNK_ON_CALL_API_ID
  - SPLUNK_ON_CALL_API_KEY
  - SPLUNK_ON_CALL_REST_ENDPOINT
exports:
  defaultEntityTypes:
    - service
  exportDetails:
    - type: CARD
      name: EntitySplunkOnCallCard
      addByDefault: true
      layoutSchemaSpecs:
        component: EntitySplunkOnCallCard
        specs:
          gridProps:
            md: 6