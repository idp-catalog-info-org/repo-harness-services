replicaCount: 1
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 100%
    maxUnavailable: 0
image:
  registry: us.gcr.io
  repository: platform-205701/idp-service
  pullPolicy: IfNotPresent

  # Overrides the image tag whose default is the chart appVersion.
  tag: "1.16.23-idp-1137-b9f06d"
  digest: ""
  imagePullSecrets: []

mongoSecrets:
  userName:
    name: harness-secrets
    key: mongodbUsername
  password:
    name: mongodb-replicaset-chart
    key: mongodb-root-password

nameOverride: ""
fullnameOverride: ""
ngServiceAccount: "test"
redislabsCATruststore: "test"
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
# fsGroup: 2000

securityContext:
  runAsUser: 65534
  runAsNonRoot: true

probes:
  livenessProbe:
    httpGet:
      path: /health
      port: 12003
    initialDelaySeconds: 60
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 20
  readinessProbe:
    httpGet:
      path: /health
      port: 12003
    initialDelaySeconds: 0
    timeoutSeconds: 5
    periodSeconds: 5
    failureThreshold: 10
  startupProbe:
    httpGet:
      path: /health
      port: 12003
    initialDelaySeconds: 45
    timeoutSeconds: 5
    periodSeconds: 5
    failureThreshold: 30
service:
  annotations: {}
  type: ClusterIP
  port: 12003
  grpcport: 9979

resources:
  limits:
    memory: 4Gi
  requests:
    cpu: 2
    memory: 4Gi

autoscaling:
  enabled: false
  targetCPU: ""
  targetMemory: ""

stoServiceGlobalToken:
  name: harness-secrets
  key: stoAppHarnessToken
nodeSelector: {}
tolerations: []
affinity: {}
