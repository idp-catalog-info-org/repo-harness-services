      properties:
        entityRef:
          type: string
          description: Unique entity reference in format kind:account[.org[.project]]/identifier
          example: "component:account/payment-service"
        kind:
          type: string
          description: Entity kind (component, api, resource, group, etc.)
          example: "component"
        name:
          type: string
          description: Human-readable entity name
          example: "payment-service"
        type:
          type: string
          description: Entity type (service, library, website, openapi, etc.)
          example: "service"
    GraphEdge:
      title: GraphEdge
      type: object
      description: Represents a directed edge in the catalog entity graph
      required:
        - source
        - target
        - relation
        - depth
      properties:
        source:
          type: string
          description: Source entity reference (matches GraphNode.entityRef)
          example: "component:account/payment-service"
        target:
          type: string
          description: Target entity reference (matches GraphNode.entityRef)
          example: "component:account/order-service"
        relation:
          type: string
          description: Relationship type (dependsOn, providesApi, consumesApi, ownedBy, etc.)
          example: "dependsOn"
        reverseRelation:
          type: string
          description: The reverse/inverse of the relation type (e.g., dependsOn → dependencyOf)
          example: "dependencyOf"
        depth:
          type: integer
          description: BFS traversal depth at which this edge was discovered
          minimum: 1
          example: 1
    GraphMetadata:
      title: GraphMetadata
      type: object
      description: Metadata about the graph traversal results
      required:
        - baseEntityRef
        - maxDepthReached
        - totalEdges
      properties:
        baseEntityRef:
          type: string
          description: The starting entity reference for the traversal
          example: "component:account/payment-service"
        maxDepthReached:
          type: integer
          description: Maximum depth reached during traversal
          minimum: 0
          example: 2
        totalEdges:
          type: integer
          description: Total number of edges in the result
          minimum: 0
          example: 15
    TeamHierarchyNode:
