          type: string
          description: Reference of the source entity (e.g. workflow:default/my-workflow)
        scopes:
          type: array
          items:
            type: string
          description: Scope expressions to restrict where this link applies (common for all targets)
        targets:
          type: array
          items:
            $ref: '#/components/schemas/LinkTarget'
        entityIdentifiers:
          type: array
          items:
