    ComparisonByHierarchyCardDataResponse:
      title: ComparisonByHierarchyCardDataResponse
      type: object
      required:
        - columns
        - rows
      properties:
        columns:
          type: array
          description: >
            Display columns. The first column is always the reserved
            `entity_count` column (the number of catalog entities scoped to the
            node); the aggregation-rule columns follow in the requested order.
          items:
            $ref: '#/components/schemas/ComparisonByHierarchyColumn'
        rows:
          type: array
          description: >
            One row per hierarchy node at the requested scope, limited to the
            top 5 nodes ordered by `entity_count` descending (ties broken by
            node identifier ascending). Nodes with zero entities are omitted.
          items:
            $ref: '#/components/schemas/ComparisonByHierarchyRow'
