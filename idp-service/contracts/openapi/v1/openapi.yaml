          type: string
          description: Workflow version to install. If not provided, the stable version is used.
        pipelineOrgIdentifier:
          type: string
          description: Org where the backing pipeline(s) will be created
        pipelineProjectIdentifier:
          type: string
          description: Project where the backing pipeline(s) will be created
        workflowOrgIdentifier:
          type: string
          description: Org where the workflow catalog entity will be created
        workflowProjectIdentifier:
          type: string
          description: Project where the workflow catalog entity will be created
        workflowInstanceIdentifier:
          type: string
          description: Unique identifier for this installed workflow instance
        workflowInstanceName:
          type: string
          description: Display name for this installed workflow instance
        adminInputValues:
          type: object
          additionalProperties:
            type: string
          description: Key-value map of admin input values
        git_details:
          $ref: '#/components/schemas/GitCreateDetails'
