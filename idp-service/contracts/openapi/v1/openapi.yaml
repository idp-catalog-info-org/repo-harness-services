      description: Graph traversal response containing nodes, edges, and metadata
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GraphTraversalResponse'
          examples:
            example-1:
              value:
                nodes:
                  - entityRef: "component:account/payment-service"
                    kind: "component"
                    name: "payment-service"
                    type: "service"
                  - entityRef: "component:account/order-service"
                    kind: "component"
                    name: "order-service"
                    type: "service"
                  - entityRef: "api:account/payment-api"
                    kind: "api"
                    name: "payment-api"
                    type: "openapi"
                edges:
                  - source: "component:account/payment-service"
                    target: "component:account/order-service"
                    relation: "dependsOn"
                    depth: 1
                  - source: "component:account/payment-service"
                    target: "api:account/payment-api"
                    relation: "providesApi"
                    depth: 1
                metadata:
                  baseEntityRef: "component:account/payment-service"
                  maxDepthReached: 1
                  totalEdges: 2
