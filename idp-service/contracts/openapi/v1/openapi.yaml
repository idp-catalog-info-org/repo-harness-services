      title: ComparisonByHierarchyColumn
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: >
            Column key (used to look up the value inside `row.values`). Either
            an aggregation rule identifier, or the reserved value `entity_count`
            for the mandatory entity-count column.
        name:
          type: string
          description: Display label for the column (the rule's name, or `Entities` for `entity_count`).
    ComparisonByHierarchyRow:
