          type: object
          description: Optional integration association. When provided, an entity link is auto-created for this workflow instance.
          properties:
            identifier:
              type: string
              description: Integration config identifier
            orgIdentifier:
              type: string
              description: Org where the integration is configured
            projectIdentifier:
              type: string
              description: Project where the integration is configured
            scopes:
              type: array
              items:
                type: string
              description: Scope expressions for entity linking (e.g. account.org1.*)
            targets:
              type: array
              items:
                $ref: '#/components/schemas/LinkTarget'
              description: Entity kinds/types this workflow targets
            fieldMappings:
              type: array
              items:
