pipeline:
  clone: false
  stages:
    - template-metadata:
        uses: rishi_stage_temp
        storeType: INLINE
        name: stage_1
      runtime: shell
      steps:
        - run:
            script: echo Rishikesh
          id: run_1
          name: run_1
        - template-metadata:
            uses: run_step_temp
            storeType: INLINE
            name: injected_template_1
          run:
            script: echo HI
          parent-template-type: template
          id: injected_template_1
          name: injected_template_1
      id: stage_1
