    - runtime: shell
      steps:
        - template-metadata:
            uses: rishiTestTemp@1.0.0
            storeType: REMOTE
            icon-name: rishi-custom-icon
            description: simple template for testing
            name: injected_template_2
          group:
            steps:
              - name: echo inputs
                id: run_1
                run:
                  script: echo "hello"
          parent-template-type: template
          id: injected_template_2
          name: injected_template_2
      id: stage_2
      name: stage_2

