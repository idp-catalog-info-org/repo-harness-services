name: Plan Concurrency Queue Store Metrics
identifier: PlanConcurrencyQueueMetrics
metricGroup: PlanConcurrencyQueueMetricsGroup
metrics:
  - metricName: pipeline_plan_concurrency_queue_operations_total
    metricDefinition: Postgres queue-store operations for the counter-based per-project plan-concurrency gate. operation in {insert, delete, fetch_batch}; outcome in {success, error}.
    type: Count
    unit: "1"
  - metricName: pipeline_plan_concurrency_queue_fetch_batch_size
    metricDefinition: Number of rows returned by a plan-creation queue fetchBatch call.
    type: Distribution
    distribution: ["0", "10", "25", "50", "100"]
    unit: "1"
