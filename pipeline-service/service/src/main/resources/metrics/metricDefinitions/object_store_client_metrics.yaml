name: Object Store Client Metrics
identifier: ObjectStoreClientMetrics
metricGroup: ObjectStoreClientMetricsGroup
metrics:
  - metricName: object_store_client_operation_latency
    metricDefinition: Latency of Object Store client operations
    type: Duration
    distribution: [ 0ms, 10ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s, 10s, 30s ]
    unit: "s"
  - metricName: object_store_client_operation_count
    metricDefinition: Total count of Object Store client operations
    type: Count
    unit: "1"
