trigger:
  name: first trigger
  identifier: first_trigger
  enabled: true
  orgIdentifier: org
  projectIdentifier: proj
  pipelineIdentifier: pipeline
  source:
    type: Webhook
    spec:
      type: Github
      spec:
        type: PullRequest
        spec:
          connectorRef: conn
          repoName: myrepo
          actions:
            - Close
            - Edit
            - Open
            - Reopen
            - Label
            - Unlabel
            - Synchronize
          payloadConditions:
            - key: k1
              operator: Equals
              value: v1
          headerConditions:
            - key: <+trigger.header['h1']>
              operator: Equals
              value: v1
          jexlCondition: true
          autoAbortPreviousExecutions: true
  inputYaml: |
    pipeline:
      identifier: secrethttp1
      stages:
        - stage:
            identifier: qaStage
            spec:
              infrastructure:
                infrastructureDefinition:
                  spec:
                    releaseName: releaseName1