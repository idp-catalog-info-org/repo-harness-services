syntax = "proto3";

package io.harness.pms.contracts.ambiance;

option java_multiple_files = true;

import "io/harness/pms/contracts/ambiance/level.proto";
import "io/harness/pms/contracts/plan/execution_metadata.proto";
import "io/harness/pms/contracts/ambiance/identity_execution_context.proto";

message ExecutionContext {
  map<string, string> setupAbstractions = 1;
  repeated io.harness.pms.contracts.ambiance.Level levels = 2;
  string planExecutionId = 3;
  int64 expressionFunctorToken = 4;
  string pipelineIdentifier = 5;
  string planId = 6;
  int64 executionStartTs = 7;

  string stageExecutionId = 8;
  string originalStageExecutionIdForRollbackMode = 9;
  int32 runSequence = 10;
  io.harness.pms.contracts.plan.ExecutionMode pipelineExecutionMode = 11;
  bool isNotificationConfigured = 12;
  string harnessYamlVersion = 13;
  IdentityExecutionContext identity_execution_context = 14;
}
