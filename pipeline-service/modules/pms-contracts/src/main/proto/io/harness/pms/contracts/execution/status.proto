syntax = "proto3";

package io.harness.pms.contracts.execution;

option java_multiple_files = true;

enum Status {
  NO_OP = 0;

  // In Progress statuses : All the in progress statuses named with ing in the end
  RUNNING = 1;
  INTERVENTION_WAITING = 2;
  TIMED_WAITING = 3;
  ASYNC_WAITING = 4;
  TASK_WAITING = 5;
  DISCONTINUING = 6;
  PAUSING = 7;

  // Final Statuses : All the final statuses named with ed in the end(except queued)
  QUEUED = 8;
  SKIPPED = 9;
  PAUSED = 10;
  ABORTED = 11;
  ERRORED = 12;
  FAILED = 13;
  EXPIRED = 14;
  SUSPENDED = 15;  // This is when a step is closed prematurely not because of the actual flow
  SUCCEEDED = 16;

  IGNORE_FAILED = 17;  // This is when step is marked as Ignored.

  APPROVAL_WAITING = 18;
  RESOURCE_WAITING = 19;

  APPROVAL_REJECTED = 20;
  INPUT_WAITING = 21;
  WAIT_STEP_RUNNING = 22;
  FREEZE_FAILED = 23;
  QUEUED_LICENSE_LIMIT_REACHED = 24;
  QUEUED_EXECUTION_CONCURRENCY_REACHED = 25;
  QUEUED_STEP_LIMIT_REACHED = 27;  // This is a status that is used to mark any step as concurrent
  STARTING_QUEUED_STEP = 28;
  UPLOAD_WAITING = 26;
  QUEUED_PLAN_CREATION = 29;    // Status while plan creation request is in queue
  STARTING_PLAN_CREATION = 30;  // Plan creation started . (This status is added to maintain idempotency in cause we
                                // receive same message from queue service twice)

  QUEUED_GLOBAL_INFRA_CAPACITY_REACHED = 31;  // This status is used when there is no capacity to run a hosted build

  // Node completed but a non-blocking governance violation was raised (OPA "Warn & Continue").
  // Positive/final status: execution continues, no rollback, distinct from IGNORE_FAILED.
  PASSED_WITH_WARNING = 32;
}
