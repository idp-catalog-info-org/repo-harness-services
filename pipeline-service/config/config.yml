mongo:
  uri: mongodb://localhost:27017/pms-harness
  connectTimeout: 30000
  serverSelectionTimeout: 90000
  socketTimeout: 360000
  maxConnectionIdleTime: 600000
  connectionsPerHost: 300
  indexManagerMode: AUTO
  transactionsEnabled: false
  aliasDBName: pms-harness
  traceMode: DISABLED
  maxStalenessSeconds: ${MAX_STALENESS_SECONDS:-90}
  queryBudget:
    # PIPE-35957 Mongo query-budget rollout. Defaults to DISABLED (no measurement, no enforcement) -- opt in
    # per-environment by setting MONGO_QUERY_BUDGET_MODE to SHADOW (safe burn-in: measure/log/count breaches but
    # never tighten maxTime) and only then ENFORCE. Mode is per-service and flippable via config (DISABLED | SHADOW
    # | ENFORCE).
    mode: ${MONGO_QUERY_BUDGET_MODE:-DISABLED}
    budgets:
      FAST: ${MONGO_QUERY_BUDGET_FAST_MS:-10000}
      SLOW: ${MONGO_QUERY_BUDGET_SLOW_MS:-60000}

