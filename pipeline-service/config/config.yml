logging:
  level: INFO
  loggers:
    org.glassfish.jersey: WARN
    allbegray.slack: WARN
    org.glassfish.jersey.server.ServerRuntime.Responder: "OFF"
  appenders:
    - type: console
      threshold: TRACE
      target: STDOUT
      logFormat: "%date{ISO8601} %green([%thread]) %highlight(%-5level) %cyan(%logger) - %msg %yellow(%replace(%mdc){'(.+)', '[$1]'}) %n"
    - type: gke-console
      threshold: TRACE
      target: STDOUT
      stackdriverLogEnabled: false
    - type: file
      threshold: TRACE
      currentLogFilename: ${LOG_FILENAME:-/opt/harness/logs/pod.log}
      archive: true
      archivedLogFilenamePattern: /opt/harness/logs/pod.%d{yyyy-MM-dd}.%i.log
      archivedFileCount: ${LOG_MAX_FILE_COUNT:-10}
      maxFileSize: ${LOG_MAX_FILE_SIZE:-50MB}
      totalSizeCap: ${LOG_TOTAL_FILE_SIZE_CAP:-1GB}
      logFormat: "%date{ISO8601} %green([%thread]) %highlight(%-5level) %cyan(%logger) - %msg %yellow(%replace(%mdc){'(.+)', '[$1]'}) %n"

server:
  applicationConnectors:
    - type: http
      # Defaults to 12001 so default-off deploys are unchanged (Service targetPort +
      # readiness/liveness probes target 12001). When the Envoy rate-limit sidecar is
      # enabled, the chart sets PMS_APPLICATION_PORT=<rateLimiting.appPort> (e.g. 12009)
      # so the app moves off 12001 and Envoy takes over the Service port.
      port: ${PMS_APPLICATION_PORT:-12001}
      maxRequestHeaderSize: 100KiB
  adminConnectors:
    - type: http
      port: 12002
  requestLog:
    appenders: []
  maxThreads: 1024

