  /v1/gitx-health:
    get:
      summary: List webhook status per repo
      tags:
        - GitX Webhooks
      responses:
        '200':
          $ref: '#/components/responses/ListGitXWebhookStatusResponse'
      operationId: list-webhook-status-per-repo
      x-stoplight:
        id: y3qddjrly4tbk
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - schema:
            type: string
          in: query
          name: repoName
          description: Filter based on repoName
        - schema:
            type: string
            enum:
              - PIPELINES
              - INPUT_SETS
              - TEMPLATES
              - SERVICES
              - INFRA
              - ENVIRONMENTS
              - OVERRIDES
          in: query
          name: entityType
          required: true
          description: Git-backed entity type to scope sync status to. Required — the response covers a single entity type per request.
      security:
        - x-api-key: []
    parameters: []
  /v1/gitx-health/repo:
    get:
      summary: Detailed GitX webhook health for a single repo
      description: Returns detailed webhook coverage information for the given repository — currently the paginated list of entity file paths that no GitX webhook is tracking, each paired with its owning scope. Use the sibling /v1/gitx-health endpoint for cross-repo metadata.
      tags:
        - GitX Webhooks
      responses:
        '200':
          $ref: '#/components/responses/ListUntrackedFilePathsResponse'
      operationId: get-gitx-health-for-repo
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - schema:
            type: string
          in: query
          name: repoName
          required: true
          description: Repository name to fetch untracked file paths for. Required.
        - schema:
            type: string
            enum:
              - PIPELINES
              - INPUT_SETS
              - TEMPLATES
              - SERVICES
              - INFRA
              - ENVIRONMENTS
              - OVERRIDES
          in: query
          name: entityType
          required: true
          description: Git-backed entity type to scope the untracked file path list to. Required — the response covers a single entity type per request.
      security:
        - x-api-key: []
    parameters: []
  /v1/gitx-health/rate-limits:
    get:
      summary: List SCM rate-limit snapshots per connector
      description: Returns the latest known SCM rate-limit consumption per (connector, provider, bucket) for the requesting account. When connectorId is omitted, returns snapshots across all connectors in the account; when provided, restricts to that connector. When provider is omitted, includes all providers.
      tags:
        - GitX Webhooks
      responses:
        '200':
          $ref: '#/components/responses/ListGitXRateLimitsResponse'
      operationId: list-gitx-rate-limits
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - schema:
            type: string
          in: query
          name: connectorId
          description: Optional connector identifier at account scope (bare identifier — no account./org./project. prefix) to filter the response to a single connector.
        - schema:
            $ref: '#/components/schemas/GitXRateLimitProvider'
          in: query
          name: provider
          description: Optional SCM provider filter.
      security:
        - x-api-key: []
    parameters: []
  /v1/gitx-health/rate-limits/timeline:
    get:
      summary: Rate-limit consumption timeline for a single connector
      description: |
        Returns a time series of SCM rate-limit consumption for the given connector, one series per bucket. Intended for charting — X axis is time, Y axis is percent_consumed = (limit - remaining) / limit * 100. The server divides the requested window into at most 1000 equal-width intervals and returns the peak percent_consumed per interval (max across all raw samples falling in that interval). Intervals with no data return null percent_consumed so the timeline remains contiguous.
      tags:
        - GitX Webhooks
      responses:
        '200':
          $ref: '#/components/responses/GitXRateLimitTimeSeriesResponse'
      operationId: list-gitx-rate-limits-timeline
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
        - schema:
            type: string
          in: query
          name: connectorId
          required: true
          description: Connector identifier at account scope (bare identifier — no account./org./project. prefix) to fetch the rate-limit timeline for. Required.
        - schema:
            $ref: '#/components/schemas/GitXRateLimitWindow'
          in: query
          name: window
          required: true
          description: Lookback window. Server picks the interval width to keep total points per bucket at or below 1000.
        - schema:
            type: string
          in: query
          name: bucket
          description: Optional bucket name (e.g. core, search, graphql, api). When omitted, one series is returned per bucket the connector has data for.
      security:
        - x-api-key: []
    parameters: []
