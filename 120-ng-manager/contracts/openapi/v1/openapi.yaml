    GitXRateLimitProvider:
      title: GitXRateLimitProvider
      type: string
      description: SCM provider that owns the rate-limit bucket.
      enum:
        - GITHUB
        - GITLAB
        - BITBUCKET
        - BITBUCKET_SERVER
        - AZURE_REPOS
    GitXRateLimitEntry:
      title: GitXRateLimitEntry
      type: object
      description: Latest known SCM rate-limit snapshot for a single (connector, provider, bucket) tuple.
      properties:
        connector_id:
          type: string
          description: Connector identifier the snapshot is scoped to.
        provider:
          $ref: '#/components/schemas/GitXRateLimitProvider'
        bucket:
          type: string
          description: Provider-specific rate-limit bucket (e.g. core, search, graphql, api).
        current_consumption:
          type: integer
          format: int64
          description: Number of requests consumed in the current window. When the provider does not emit a used counter, this is derived as limit minus remaining.
        limit:
          type: integer
          format: int64
          description: Maximum requests allowed in the current window.
        remaining:
          type: integer
          format: int64
          description: Requests remaining in the current window.
        resets_at:
          type: integer
          format: int64
          description: Epoch millis when the current window resets, as reported by the provider. UI computes the countdown as resets_at - Date.now() (clamped to zero). 0 sentinel when the provider does not emit a reset time.
        too_many_requests_in_window:
          type: integer
          format: int64
          description: |
            Count of HTTP 429 responses this (connector, bucket) has received from the Git provider during the current rate-limit window — i.e., since the last provider-reported reset up to now. Effectively restarts when the window resets (see resets_at). A value of 0 means the connector is healthy; non-zero means the provider is actively throttling it. For providers that use per-second/concurrency limits rather than a windowed quota (notably Bitbucket DC / Server), this counter still increments on every 429 but limit and remaining may be -1 sentinel values.
        last_updated_at:
          type: integer
          format: int64
          description: Epoch millis when this snapshot was last updated.
    ListGitXRateLimitsResponseDTO:
      title: ListGitXRateLimitsResponseDTO
      type: object
      properties:
        rate_limits:
          type: array
          description: One entry per (connector, provider, bucket), sliced by the page/limit query params.
          items:
            $ref: '#/components/schemas/GitXRateLimitEntry'
    GitXRateLimitWindow:
      title: GitXRateLimitWindow
      type: string
      description: Lookback window for the rate-limit timeline endpoint.
      enum:
        - ONE_HOUR
        - THREE_HOURS
        - SIX_HOURS
        - TWELVE_HOURS
        - TWENTY_FOUR_HOURS
    GitXRateLimitPoint:
      title: GitXRateLimitPoint
      type: object
      description: A single downsampled point in a rate-limit timeline.
      properties:
        timestamp_ms:
          type: integer
          format: int64
          description: Epoch millis at the start of the interval this point represents.
        percent_consumed:
          type: number
          format: double
          nullable: true
          description: Peak percent of rate limit consumed in this interval, in [0, 100]. Computed as the maximum across all raw samples that fall in the interval, preserving near-throttle spikes that averaging would hide. Null when no data landed in the interval or the provider did not emit rate-limit headers.
    GitXRateLimitSeries:
      title: GitXRateLimitSeries
      type: object
      description: One rate-limit timeline series, scoped to a single bucket.
      properties:
        bucket:
          type: string
          description: Provider-specific rate-limit bucket (e.g. core, search, graphql, api).
        points:
          type: array
          items:
            $ref: '#/components/schemas/GitXRateLimitPoint'
    GitXRateLimitTimeSeriesResponseDTO:
      title: GitXRateLimitTimeSeriesResponseDTO
      type: object
      description: Rate-limit consumption timeline for one connector across the requested window.
      properties:
        connector_id:
          type: string
          description: Connector identifier the timeline is scoped to.
        provider:
          $ref: '#/components/schemas/GitXRateLimitProvider'
        window:
          $ref: '#/components/schemas/GitXRateLimitWindow'
        resolution_seconds:
          type: integer
          format: int64
          description: Interval width the server picked so that total points per bucket is at most 1000.
        start_ms:
          type: integer
          format: int64
          description: Epoch millis at the start of the returned window (inclusive). Rounded down to a resolution_seconds boundary so identical requests within the same slot return byte-identical responses. Equals the timestamp_ms of the first point in each series.
        end_ms:
          type: integer
          format: int64
          description: Epoch millis at the end of the returned window (exclusive). end_ms - start_ms is always a multiple of resolution_seconds * 1000.
        series:
          type: array
          items:
            $ref: '#/components/schemas/GitXRateLimitSeries'
