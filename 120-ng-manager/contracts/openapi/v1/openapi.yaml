paths:
  '/v1/orgs/{org}/projects/{project}/services/{service}':
    get:
      summary: Retrieve a service
      operationId: get-service
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
      description: Retrieves the specified service
      security:
        - x-api-key: []
      responses:
        '200':
          $ref: '#/components/responses/ServiceResponse'
      tags:
        - Project Services
    parameters:
      - $ref: '#/components/parameters/OrgPathParam'
      - $ref: '#/components/parameters/ProjectPathParam'
      - $ref: '#/components/parameters/ServicePathParam'
    put:
      summary: Update Service
      operationId: update-service
      responses:
        '200':
          $ref: '#/components/responses/ServiceResponse'
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
      requestBody:
        $ref: '#/components/requestBodies/ServiceUpdateRequest'
      description: Updates the specified service
      security:
        - x-api-key: []
      tags:
        - Project Services
    delete:
      summary: Delete a Service
      operationId: delete-service
      responses:
        '200':
          $ref: '#/components/responses/ServiceResponse'
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
        - $ref: '#/components/parameters/ForceDelete'
      description: Deletes the requested service.
      security:
        - x-api-key: []
      tags:
        - Project Services
  '/v1/orgs/{org}/projects/{project}/services':
    get:
      summary: List Services
      responses:
        '200':
          $ref: '#/components/responses/ServiceListResponse'
      operationId: get-services
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SearchTerm'
        - $ref: '#/components/parameters/ServiceIdentifiers'
        - $ref: '#/components/parameters/Sort'
        - schema:
            type: boolean
          in: query
          name: is_access_list
          description: Specifies whether the list is an access list. An access list is a list of services that you are permitted to use in a pipeline.
        - $ref: '#/components/parameters/DeploymentType'
        - schema:
            type: boolean
          name: git_ops_enabled
          in: query
          description: Enables you to use the service in Harness GitOps PR pipelines.
        - $ref: '#/components/parameters/AccountHeader'
        - $ref: '#/components/parameters/Order'
      security:
        - x-api-key: []
      description: Returns a list of the services for which you have view permissions in the given project.
      tags:
        - Project Services
    post:
      summary: Create a Service
      operationId: create-service
      responses:
        '201':
          $ref: '#/components/responses/ServiceResponse'
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
      requestBody:
        $ref: '#/components/requestBodies/ServiceCreateRequest'
      description: Creates a service
      security:
        - x-api-key: []
      tags:
        - Project Services
    parameters:
      - $ref: '#/components/parameters/OrgPathParam'
      - $ref: '#/components/parameters/ProjectPathParam'
  '/v1/orgs/{org}/services/{service}':
    get:
      summary: Retrieve a service
      operationId: get-org-scoped-service
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
      description: Retrieves the specified service
      security:
        - x-api-key: []
      responses:
        '200':
          $ref: '#/components/responses/ServiceResponse'
      tags:
        - Org Services
    parameters:
      - $ref: '#/components/parameters/OrgPathParam'
      - $ref: '#/components/parameters/ServicePathParam'
    put:
      summary: Update Service
      operationId: update-org-scoped-service
      responses:
        '200':
          $ref: '#/components/responses/ServiceResponse'
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
      requestBody:
        $ref: '#/components/requestBodies/ServiceUpdateRequest'
      description: Updates the specified service
      security:
        - x-api-key: []
      tags:
        - Org Services
    delete:
      summary: Delete a service
      operationId: delete-org-scoped-service
      responses:
        '200':
          $ref: '#/components/responses/ServiceResponse'
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
        - $ref: '#/components/parameters/ForceDelete'
      description: Deletes the requested service
      security:
        - x-api-key: []
      tags:
        - Org Services
  '/v1/orgs/{org}/services':
    get:
      summary: List Services
      responses:
        '200':
          $ref: '#/components/responses/ServiceListResponse'
      operationId: get-org-scoped-services
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SearchTerm'
        - $ref: '#/components/parameters/ServiceIdentifiers'
        - $ref: '#/components/parameters/Sort'
        - schema:
            type: boolean
          in: query
          name: is_access_list
          description: Specifies whether the list is an access list. An access list is a list of services that you are permitted to use in a pipeline.
        - $ref: '#/components/parameters/DeploymentType'
        - schema:
            type: boolean
          name: git_ops_enabled
          in: query
          description: Enables you to use the service in Harness GitOps PR pipelines.
        - $ref: '#/components/parameters/AccountHeader'
        - $ref: '#/components/parameters/Order'
      security:
        - x-api-key: []
      description: Returns a list of the services for which you have view permissions in the given project.
      tags:
        - Org Services
    post:
      summary: Create a service
      operationId: create-org-scoped-service
      responses:
        '201':
          $ref: '#/components/responses/ServiceResponse'
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
      requestBody:
        $ref: '#/components/requestBodies/ServiceCreateRequest'
      description: Creates a service
      security:
        - x-api-key: []
      tags:
        - Org Services
    parameters:
      - $ref: '#/components/parameters/OrgPathParam'
  '/v1/services/{service}':
    get:
      summary: Retrieve a service
      operationId: get-account-scoped-service
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
      description: Retrieves the specified service
      security:
        - x-api-key: []
      responses:
        '200':
          $ref: '#/components/responses/ServiceResponse'
      tags:
        - Account Services
    parameters:
      - $ref: '#/components/parameters/ServicePathParam'
    put:
      summary: Update service
      operationId: update-account-scoped-service
      responses:
        '200':
          $ref: '#/components/responses/ServiceResponse'
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
      requestBody:
        $ref: '#/components/requestBodies/ServiceUpdateRequest'
      description: Updates the specified service
      security:
        - x-api-key: []
      tags:
        - Account Services
    delete:
      summary: Delete a service
      operationId: delete-account-scoped-service
      responses:
        '200':
          $ref: '#/components/responses/ServiceResponse'
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
        - $ref: '#/components/parameters/ForceDelete'
      description: Deletes the requested service
      security:
        - x-api-key: []
      tags:
        - Account Services
  /v1/services:
    get:
      summary: List services
      responses:
        '200':
          $ref: '#/components/responses/ServiceListResponse'
      operationId: get-account-scoped-services
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SearchTerm'
        - $ref: '#/components/parameters/ServiceIdentifiers'
        - $ref: '#/components/parameters/Sort'
        - schema:
            type: boolean
          in: query
          name: is_access_list
          description: Specifies whether the list is an access list. An access list is a list of services that you are permitted to use in a pipeline.
        - $ref: '#/components/parameters/DeploymentType'
        - schema:
            type: boolean
          name: git_ops_enabled
          in: query
          description: Enables you to use the service in Harness GitOps PR pipelines.
        - $ref: '#/components/parameters/AccountHeader'
        - $ref: '#/components/parameters/Order'
      security:
        - x-api-key: []
      description: Returns a list of the services for which you have view permissions in the given project.
      tags:
        - Account Services
    post:
      summary: Create a service
      operationId: create-account-scoped-service
      responses:
        '201':
          $ref: '#/components/responses/ServiceResponse'
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
      requestBody:
        $ref: '#/components/requestBodies/ServiceCreateRequest'
      description: Creates a service
      security:
        - x-api-key: []
      tags:
        - Account Services
    parameters: []
  '/v1/orgs/{org}/projects/{project}/dashboard/services':
    get:
      summary: List Dashboard Services
      operationId: get-dashboard-services
      description: 'Returns a paginated list of services with dashboard metrics including deployment types, creation timestamp, and last modified timestamp.'
      responses:
        '200':
          $ref: '#/components/responses/ServiceDashboardListResponse'
        '400':
          headers: {}
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 100
            maximum: 1000
          description: Number of services to return per page
        - $ref: '#/components/parameters/SearchTerm'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - name: filter_identifier
          in: query
          required: false
          schema:
            type: string
          description: Identifier of a saved Filter
        - name: service_identifiers
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: List of Service identifiers on the basis of which services are filtered
        - name: service_names
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: List of Service names on the basis of which services are filtered
        - schema:
            type: array
            items:
              type: string
            maxItems: 128
            example: 'team:payments'
          examples:
            key_and_value:
              value: 'team:payments'
              summary: Tag having both Key and Value
            key_only:
              value: team
              summary: Tag having only Key
          in: query
          name: tags
          description: 'Filter tags as a key:value pair'
        - name: service_types
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: Service types on the basis of which services are filtered
        - name: repo_name
          in: query
          required: false
          schema:
            type: string
          description: Repository name for filtering services (used with Git Experience)
      security:
        - x-api-key: []
      tags:
        - Project CD Dashboard
    parameters:
      - $ref: '#/components/parameters/OrgPathParam'
      - $ref: '#/components/parameters/ProjectPathParam'
  '/v1/orgs/{org}/dashboard/services':
    get:
      summary: List Dashboard Services
      operationId: get-org-scoped-dashboard-services
      description: 'Returns a paginated list of services with dashboard metrics including deployment types, creation timestamp, and last modified timestamp for the organization.'
      responses:
        '200':
          $ref: '#/components/responses/ServiceDashboardListResponse'
        '400':
          headers: {}
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 100
            maximum: 1000
          description: Number of services to return per page
        - $ref: '#/components/parameters/SearchTerm'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - name: filter_identifier
          in: query
          required: false
          schema:
            type: string
          description: Identifier of a saved Filter
        - name: service_identifiers
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: List of Service identifiers on the basis of which services are filtered
        - name: service_names
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: List of Service names on the basis of which services are filtered
        - schema:
            type: array
            items:
              type: string
            maxItems: 128
            example: 'team:payments'
          examples:
            key_and_value:
              value: 'team:payments'
              summary: Tag having both Key and Value
            key_only:
              value: team
              summary: Tag having only Key
          in: query
          name: tags
          description: 'Filter tags as a key:value pair'
        - name: service_types
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: Service types on the basis of which services are filtered
        - name: repo_name
          in: query
          required: false
          schema:
            type: string
          description: Repository name for filtering services (used with Git Experience)
      security:
        - x-api-key: []
      tags:
        - Org CD Dashboard
    parameters:
      - $ref: '#/components/parameters/OrgPathParam'
  /v1/dashboard/services:
    get:
      summary: List Dashboard Services
      operationId: get-account-scoped-dashboard-services
      description: 'Returns a paginated list of services with dashboard metrics including deployment types, creation timestamp, and last modified timestamp for the account.'
      responses:
        '200':
          $ref: '#/components/responses/ServiceDashboardListResponse'
        '400':
          headers: {}
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 100
            maximum: 1000
          description: Number of services to return per page
        - $ref: '#/components/parameters/SearchTerm'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - name: filter_identifier
          in: query
          required: false
          schema:
            type: string
          description: Identifier of a saved Filter
        - name: service_identifiers
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: List of Service identifiers on the basis of which services are filtered
        - schema:
            type: array
            items:
              type: string
            maxItems: 128
            example: 'team:payments'
          examples:
            key_and_value:
              value: 'team:payments'
              summary: Tag having both Key and Value
            key_only:
              value: team
              summary: Tag having only Key
          in: query
          name: tags
          description: 'Filter tags as a key:value pair'
        - name: service_types
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: Service types on the basis of which services are filtered
        - name: service_names
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: List of Service names on the basis of which services are filtered
        - name: repo_name
          in: query
          required: false
          schema:
            type: string
          description: Repository name for filtering services (used with Git Experience)
      security:
        - x-api-key: []
      tags:
        - Account CD Dashboard
  '/v1/creditOverUsage/{accountIdentifier}':
    get:
      summary: Get over usage count of Credits for a given account
      tags:
        - Credits OverUsage Data By Account
      responses:
        '200':
          $ref: '#/components/schemas/CreditOverUsage'
        '400':
          headers: {}
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
      operationId: credits-overusage
      x-internal: false
      security:
        - bearerAuth: []
      parameters:
        - name: accountIdentifier
          in: path
          required: true
          description: Account Identifier for the Entity.
          schema:
            type: string
  '/v1/subscription/{accountIdentifier}':
    get:
      summary: Retrieve type of licenses for an account
      tags:
        - Account License Type
      operationId: get-license-type
      responses:
        '200':
          $ref: '#/components/schemas/LicenseTypeResponse'
        '400':
          headers: {}
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
      x-internal: false
      security:
        - bearerAuth: []
      parameters:
        - name: accountIdentifier
          in: path
          required: true
          description: Account Identifier for the Entity.
          schema:
            type: string
  '/v1/subscription/devops/{accountIdentifier}':
    get:
      summary: Get subscriptions information for the Devops Essentials package for an accountIdentifier.
      tags:
        - Devops Essentials License Data By Account
      responses:
        '200':
          $ref: '#/components/schemas/DevopsEssentialsResponse'
        '400':
          headers: {}
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
        x-internal: false
      operationId: get-devops-essentials-license
      security:
        - bearerAuth: []
      parameters:
        - name: accountIdentifier
          in: path
          required: true
          description: Account Identifier for the Entity.
          schema:
            type: string
  /v1/ip-allowlist:
    post:
      summary: Create a IP Allowlist config
      operationId: create-ip-allowlist-config
      responses:
        '201':
          $ref: '#/components/responses/IPAllowlistConfigResponse'
      description: Creates a new IP Allowlist config
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
      security:
        - x-api-key: []
      requestBody:
        $ref: '#/components/requestBodies/IPAllowlistConfigRequest'
      tags:
        - IP Allowlist
      x-internal: false
    get:
      summary: List IP Allowlist Configs
      operationId: get-ip-allowlist-configs
      responses:
        '200':
          $ref: '#/components/responses/IPAllowlistConfigListResponse'
      description: Retrieves the information of the IP Allowlist Config
      parameters:
        - $ref: '#/components/parameters/SearchTerm'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/AccountHeader'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - schema:
            type: string
          in: query
          description: This is to filter IP allowlist configs only blocked from UI or API
          name: allowed_source_type
      security:
        - x-api-key: []
      tags:
        - IP Allowlist
      x-internal: false
    parameters: []
  '/v1/ip-allowlist/{ip-config-identifier}':
    get:
      summary: Retrieve a IP Allowlist config
      operationId: get-ip-allowlist-config
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
      description: Retrieves the specified IP Allowlist config
