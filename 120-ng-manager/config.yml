cdcKafka:
  enabled: ${CDC_KAFKA_ENABLED:-false}
  consumers:
    # GITOPS team — utilizationSnapshot CDC (parallel HKafkaConsumer).
    # Three-step config-driven cutover (no FF caching issues):
    #   kafkaConsumerEnabled: flip ON to register the consumer thread at boot (starts draining)
    #   processingEnabled:    flip ON after connector is verified → Kafka consumer writes to TimescaleDB
    #   redisShortCircuit:    flip ON after Kafka is verified → Redis consumer stops processing
    - name: utilizationSnapshot
      topic: ${CDC_KAFKA_UTILIZATION_SNAPSHOT_TOPIC:-gitops.harness-gitops.utilization_snapshot}
      maxPollRecords: ${CDC_KAFKA_UTILIZATION_SNAPSHOT_MAX_POLL_RECORDS:-500}
      kafkaConsumerEnabled: ${CDC_KAFKA_UTILIZATION_SNAPSHOT_ENABLED:-false}
      processingEnabled: ${CDC_KAFKA_UTILIZATION_SNAPSHOT_PROCESSING_ENABLED:-false}
      redisShortCircuit: ${CDC_REDIS_UTILIZATION_SNAPSHOT_SHORT_CIRCUIT:-false}
    # GITOPS team — applications CDC (parallel HKafkaConsumer, JSON serialization).
    # Same three-step cutover as utilizationSnapshot:
    #   Step 1 – kafkaConsumerEnabled=true   → consumer thread registers at boot (drain-only)
    #   Step 2 – processingEnabled=true      → Kafka consumer starts processing events
    #   Step 3 – redisShortCircuit=true      → Redis consumer acks without processing
    - name: applications
      topic: ${CDC_KAFKA_APPLICATIONS_TOPIC:-gitops.harness-gitops.applications}
      maxPollRecords: ${CDC_KAFKA_APPLICATIONS_MAX_POLL_RECORDS:-500}
      kafkaConsumerEnabled: ${CDC_KAFKA_APPLICATIONS_ENABLED:-false}
      processingEnabled: ${CDC_KAFKA_APPLICATIONS_PROCESSING_ENABLED:-false}
      redisShortCircuit: ${CDC_REDIS_APPLICATIONS_SHORT_CIRCUIT:-false}
    # GTM team — moduleLicenses CDC (sequential, IDP-style Runnable consumer).
    # Three-step config-driven cutover (no FF caching issues):
    #   kafkaConsumerEnabled: flip ON to register the consumer thread at boot (starts draining)
    #   processingEnabled:    flip ON after connector is verified → Kafka consumer writes to TimescaleDB
    #   redisShortCircuit:    flip ON after Kafka is verified → Redis consumer stops processing
    - name: moduleLicenses
      topic: ${CDC_KAFKA_MODULE_LICENSES_TOPIC:-ngMongo.ng-harness.moduleLicenses}
      maxPollRecords: ${CDC_KAFKA_MODULE_LICENSES_MAX_POLL_RECORDS:-500}
      kafkaConsumerEnabled: ${CDC_KAFKA_MODULE_LICENSES_ENABLED:-false}
      processingEnabled: ${CDC_KAFKA_MODULE_LICENSES_PROCESSING_ENABLED:-false}
      redisShortCircuit: ${CDC_REDIS_MODULE_LICENSES_SHORT_CIRCUIT:-false}
    # PIPELINE team — planExecutionsSummary CDC (sequential, single-thread Runnable consumer).
    # Same three-step cutover as GTM moduleLicenses:
    #   Step 1 – kafkaConsumerEnabled=true   → consumer thread registers at boot (drain-only)
    #   Step 2 – processingEnabled=true      → Kafka consumer starts processing events
    #   Step 3 – redisShortCircuit=true      → Redis consumer acks without processing
    - name: planExecutionsSummaryCD
      topic: ${CDC_KAFKA_PLAN_EXEC_SUMMARY_CD_TOPIC:-pmsMongo.pms-harness.planExecutionsSummary}
      maxPollRecords: ${CDC_KAFKA_PLAN_EXEC_SUMMARY_CD_MAX_POLL_RECORDS:-100}
      kafkaConsumerEnabled: ${CDC_KAFKA_PLAN_EXEC_SUMMARY_CD_ENABLED:-false}
      processingEnabled: ${CDC_KAFKA_PLAN_EXEC_SUMMARY_CD_PROCESSING_ENABLED:-false}
      redisShortCircuit: ${CDC_REDIS_PLAN_EXEC_SUMMARY_CD_SHORT_CIRCUIT:-false}

