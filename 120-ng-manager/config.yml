# SPIRE-based service-to-service mesh identity. Fully opt-in: with
# MESH_IDENTITY_INBOUND_ENABLED=false (default), NextGenApplication skips all mesh
# wiring and the existing HMAC path is unchanged. Enable in POC / staging via env vars.
meshIdentity:
  inboundEnabled: ${MESH_IDENTITY_INBOUND_ENABLED:-false}
  outboundEnabled: ${MESH_IDENTITY_OUTBOUND_ENABLED:-false}
  outboundOnly: ${MESH_IDENTITY_OUTBOUND_ONLY:-false}
  # Fallback to HMAC when mesh validation fails. Keep true during rollout.
  fallbackEnabled: ${MESH_IDENTITY_FALLBACK_ENABLED:-true}
  rejectAuthorizationWithoutMeshHeader: ${MESH_IDENTITY_REJECT_AUTH_WITHOUT_MESH_HEADER:-false}
  audience: ${MESH_IDENTITY_AUDIENCE:-NextGenManager}
  allowedAudiences: ${MESH_IDENTITY_ALLOWED_AUDIENCES:-gateway-internal-service}
