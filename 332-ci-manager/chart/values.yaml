rbac:
  rules: []

probes:
  readinessProbe:
    httpGet:
      path: /health
      port: http-ci-manager
    initialDelaySeconds: 60
    timeoutSeconds: 5
    periodSeconds: 5
    failureThreshold: 8
  livenessProbe:
    httpGet:
      path: /health/liveness
      port: http-ci-manager
    initialDelaySeconds: 40
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 20

pdb:
  create: false

jfr:
  image:
    registry: registry.access.redhat.com
    repository: ubi8/ubi-minimal
    pullPolicy: Always
    tag: "8.9-1029"
    digest: ""
    imagePullSecrets: []
