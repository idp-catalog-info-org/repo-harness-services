        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailureDTO'
            application/yaml:
              schema:
                $ref: '#/components/schemas/FailureDTO'
        '404':
          description: Environment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailureDTO'
            application/yaml:
              schema:
                $ref: '#/components/schemas/FailureDTO'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
