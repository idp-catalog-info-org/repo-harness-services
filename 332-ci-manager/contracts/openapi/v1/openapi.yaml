openapi: 3.0.3
info:
  title: Harness CI Manager CD Entities API
  version: '1.0'
  description: This is the OpenAPI Spec 3 for the CI Manager Environment, Service, Infra API. This API allows for creating, retrieving, updating, and deleting Environment, Service, Infra.
  contact:
    email: contact@harness.io
servers:
  - url: 'https://app.harness.io'
    description: Harness host URL.
tags:
  - name: Environments
    description: This contains APIs for performing CRUD operations on Environments.
    x-displayName: 'Environments [Beta]'
paths:
  '/v1/environment':
    post:
      summary: Create an Environment at Account level
      operationId: createEnvironment
      description: Creates an Environment at Account level.
      security:
        - x-api-key: [ ]
      parameters:
        - schema:
            type: string
          in: header
          name: Harness-Account
          required: true
          description: Account Identifier for the entity.
      tags:
        - Account Environments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentRequest'
          application/yaml:
            schema:
              $ref: '#/components/schemas/EnvironmentRequest'
        required: true
        description: Details of the Environment to be created
      responses:
        '201':
          description: Successfully created Environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentResponseWrapper'
            application/yaml:
              schema:
                $ref: '#/components/schemas/EnvironmentResponseWrapper'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailureDTO'
            application/yaml:
              schema:
                $ref: '#/components/schemas/FailureDTO'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
    get:
      summary: Get all Environments at Account level
      operationId: getEnvironments
      description: Retrieves all Environments at Account level.
      security:
        - x-api-key: [ ]
      parameters:
        - schema:
            type: string
          in: header
          name: Harness-Account
          required: true
          description: Account Identifier for the entity.
        - schema:
            type: integer
            default: 0
          in: query
          name: page
          required: false
          description: Page index for pagination.
        - schema:
            type: integer
            default: 20
            maximum: 1000
          in: query
          name: limit
          required: false
          description: Number of items per page.
        - schema:
            type: string
          in: query
          name: sort
          required: false
          description: Sort criteria in the format 'property,asc|desc'.
        - schema:
            type: boolean
            default: false
          in: query
          name: is_access_list
          description: Specifies whether the list is an access list. An access list is a list of environments that you are permitted to use in a pipeline.
        - schema:
            type: string
          in: query
          name: search_term
          required: false
          description: This would be used to filter resources having attributes matching with search term.
        - schema:
            type: boolean
            default: false
          in: query
          name: include_children_scope
          required: false
          description: Specify true if environments with runtime access to be fetched.
      tags:
        - Account Environments
      responses:
        '200':
          description: Successfully retrieved Environments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentListResponseWrapper'
            application/yaml:
              schema:
                $ref: '#/components/schemas/EnvironmentListResponseWrapper'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailureDTO'
            application/yaml:
              schema:
                $ref: '#/components/schemas/FailureDTO'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
    put:
      summary: Update an Environment at Account level
      operationId: updateEnvironment
      description: Updates an Environment by its identifier at Account level.
      security:
        - x-api-key: [ ]
      parameters:
        - schema:
            type: string
          in: header
          name: Harness-Account
          required: true
          description: Account Identifier for the entity.
      tags:
        - Account Environments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentRequest'
          application/yaml:
            schema:
              $ref: '#/components/schemas/EnvironmentRequest'
        required: true
        description: Updated details of the Environment
      responses:
        '200':
          description: Successfully updated Environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentResponseWrapper'
            application/yaml:
              schema:
                $ref: '#/components/schemas/EnvironmentResponseWrapper'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailureDTO'
            application/yaml:
              schema:
                $ref: '#/components/schemas/FailureDTO'
        '404':
          description: Environment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailureDTO'
            application/yaml:
              schema:
                $ref: '#/components/schemas/FailureDTO'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
            application/yaml:
