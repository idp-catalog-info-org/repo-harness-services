id: ID_PLACEHOLDER
name: ID_PLACEHOLDER

# Harness File Store Kustomize patches manifest. Patch files (files) are fetched from the Harness
# File Store and written to the runner workspace by the manifest step.
inputs:
  storeType:
    type: string
    description: Unified store discriminator
    default: harness
  files:
    type: list
    description: Kustomize patch file/folder references from the Harness File Store
    default: ${{ngService.spec.manifests.ID_PLACEHOLDER.manifest.spec.store.spec.files}}
  patchesPaths:
    type: list
    description: Kustomize patch file/folder references from the Harness File Store
    default: ${{ngService.spec.manifests.ID_PLACEHOLDER.manifest.spec.store.spec.files}}

run:
  type: run
  container:
    image: alpine:3.20
    connector: account.harnessImage
  script: |-
    echo "Prepared Harness File Store Kustomize patches manifest 'ID_PLACEHOLDER' on the runner"
