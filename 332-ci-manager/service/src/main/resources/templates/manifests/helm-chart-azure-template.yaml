id: ID_PLACEHOLDER
name: ID_PLACEHOLDER

inputs:
  connector:
    type: connector
    description: Git connector (resolved from connectorRef)
    default: ${{ngService.spec.manifests.ID_PLACEHOLDER.manifest.spec.store.spec.connectorRef}}
  branch:
    type: string
    description: Branch name (optional, mutually exclusive with commitId)
    default: ${{ngService.spec.manifests.ID_PLACEHOLDER.manifest.spec.store.spec.branch}}
  commitId:
    type: string
    description: Commit SHA (optional, mutually exclusive with branch)
    default: ${{ngService.spec.manifests.ID_PLACEHOLDER.manifest.spec.store.spec.commitId}}
  paths:
    type: list
    description: List of file paths to fetch from the repository
    default: ${{ngService.spec.manifests.ID_PLACEHOLDER.manifest.spec.store.spec.folderPath}}
  repoName:
    type: string
    description: Repository name
    default: ${{ngService.spec.manifests.ID_PLACEHOLDER.manifest.spec.store.spec.repoName}}
  folderPath:
    type: string
    description: Folder path in the repository
    default: ${{ngService.spec.manifests.ID_PLACEHOLDER.manifest.spec.store.spec.folderPath}}
  chartName:
    type: string
    description: Helm chart name
    default: ${{ngService.spec.manifests.ID_PLACEHOLDER.manifest.spec.chartName}}
  chartVersion:
    type: string
    description: Helm chart version
    default: ${{ngService.spec.manifests.ID_PLACEHOLDER.manifest.spec.chartVersion}}
  helmVersion:
    type: string
    description: Helm version
    default: ${{ngService.spec.manifests.ID_PLACEHOLDER.manifest.spec.helmVersion}}
  valuesPaths:
    type: list
    description: Paths to values YAML files
    default: ${{ngService.spec.manifests.ID_PLACEHOLDER.manifest.spec.valuesPaths}}
  skipResourceVersioning:
    type: boolean
    description: Skip resource versioning
    default: ${{ngService.spec.manifests.ID_PLACEHOLDER.manifest.spec.skipResourceVersioning}}
  enableDeclarativeRollback:
    type: boolean
    description: Enable declarative rollback
    default: ${{ngService.spec.manifests.ID_PLACEHOLDER.manifest.spec.enableDeclarativeRollback}}
  commandFlags:
    type: list
    description: Helm command flags
    default: ${{ngService.spec.manifests.ID_PLACEHOLDER.manifest.spec.commandFlags}}
  subChartPath:
    type: string
    description: Sub-chart path
    default: ${{ngService.spec.manifests.ID_PLACEHOLDER.manifest.spec.subChartPath}}
  fetchHelmChartMetadata:
    type: boolean
    description: Fetch Helm chart metadata
    default: ${{ngService.spec.manifests.ID_PLACEHOLDER.manifest.spec.fetchHelmChartMetadata}}
  optionalValuesYaml:
    type: boolean
    description: Optional values YAML
    default: ${{ngService.spec.manifests.ID_PLACEHOLDER.manifest.spec.optionalValuesYaml}}
  flags:
    type: string
    description: Command flags
    default: ${{ngService.spec.manifests.ID_PLACEHOLDER.manifest.spec.commandFlags}}

run:
  type: run
  container:
    image: harness/drone-git:1.6.4
    connector: account.harnessImage
  env:
    DRONE_BRANCH: ${{inputs.branch}}
    DRONE_COMMIT_BRANCH: ${{inputs.branch}}
    DRONE_COMMIT: ${{inputs.commitId}}
    DRONE_COMMIT_SHA: ${{inputs.commitId}}
    DRONE_GIT_HTTP_URL: ${{inputs.connector.url}}
    DRONE_REMOTE_URL: ${{inputs.connector.url}}
    DRONE_REPO_BRANCH: ${{inputs.branch}}
    DRONE_WORKSPACE: ${{serviceOutput.manifests.ID_PLACEHOLDER.id}}
    DRONE_NETRC_PASSWORD: ${{inputs.connector.password}}
    DRONE_NETRC_USERNAME: ${{inputs.connector.username}}
    DRONE_NETRC_MACHINE: ${{inputs.connector.domain}}
    DRONE_REPO_SCM: ${{inputs.connector.type}}
    DRONE_SSH_KEY: ${{inputs.connector.sshKey}}
    DRONE_GIT_SSH_URL: ${{inputs.connector.url}}
    PLUGIN_OUTPUT_FILE_PATHS_CONTENT: ${{serviceOutput.manifests.ID_PLACEHOLDER.overrides}}
