id: ID_PLACEHOLDER
name: ID_PLACEHOLDER
run:
  type: run
  container:
    image: harnessdev/harness-rendering:0.0.1
    connector: account.harnessImage
  env:
    PLUGIN_MANIFEST_PATH: ${{runtime.manifestPath}}
    PLUGIN_OVERRIDES_PATH: ${{serviceOutput.manifests.overrides}}
    PLUGIN_FILES: serverless.yml,serverless.yaml,serverless.json,<+serviceOutput.manifests.primary.inputs.configOverridePath>
