pipeline:
  name: CI-23304-codebase
  identifier: CI23304codebase
  projectIdentifier: SahithiProject
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: account.SahithiGit
        repoName: mycode
        cloneDirectory: /harness/<+secrets.getValue('cloneDirSecret')>
        preFetchCommand: echo <+secrets.getValue("preFetchSecret")>
  stages:
    - stage:
        name: build
        identifier: build
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: account.SahithiK8
              namespace: harness-delegate-ng
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  type: Run
                  name: Run_1
                  identifier: Run_1
                  spec:
                    connectorRef: SahithiDockerConnector
                    image: alpine
                    shell: Sh
                    command: echo "build"
    - stage:
        name: build2
        identifier: build2
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: account.SahithiK8
              namespace: harness-delegate-ng
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  type: Run
                  name: Run_2
                  identifier: Run_2
                  spec:
                    connectorRef: SahithiDockerConnector
                    image: alpine
                    shell: Sh
                    command: echo "build2"
    - stage:
        name: security
        identifier: security
        description: ""
        type: SecurityTests
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: account.SahithiK8
              namespace: harness-delegate-ng
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
